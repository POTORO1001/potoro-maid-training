<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>新人メイド研修シミュレーター</title>
  <style>
    :root {
      --pink: #ff8fbd;
      --pink-dark: #df5c9b;
      --purple: #b58cff;
      --cream: #fffaf2;
      --brown: #503747;
      --muted: #8c7481;
      --ok: #2fa875;
      --ng: #df5c72;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --shadow: 0 18px 38px rgba(126, 64, 98, 0.22);
      --radius: 24px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      color: var(--brown);
      background: #fff4fa;
    }
    body {
      user-select: none;
      touch-action: manipulation;
    }
    button {
      font-family: inherit;
    }
    .app {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255, 246, 251, 0.25), rgba(255, 255, 255, 0.5)),
        url("img/bg_room.jpg") center center / cover no-repeat;
    }
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.28s ease both;
    }
    .screen.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* ================================
       縦向き注意
    ================================= */
    .rotate-notice {
      display: none;
      position: fixed;
      z-index: 999;
      inset: 0;
      padding: 28px;
      background: linear-gradient(160deg, #fff5fb, #f5edff);
      text-align: center;
      align-items: center;
      justify-content: center;
    }
    .rotate-card {
      width: min(92vw, 520px);
      padding: 30px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      border: 2px solid rgba(255, 255, 255, 0.9);
    }
